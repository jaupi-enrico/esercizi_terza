<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videogiochi</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <h2 id="titolo">I miei videogiochi preferiti</h2>
    <div class="contenitore-box">
        <div class="box">
            <h2>Minecraft</h2>
            <p>Gioco open-world di costruzione a blocchi ed avventura</p>
        </div>
        <div class="box">
            <h2>Super Mario</h2>
            <p>Classico gioco Nintendo con Mario e Luigi</p>
        </div>
        <div class="box">
            <h2>FIFA</h2>
            <p>Simulazione di calcio con squadre internazional</p>
        </div>
        <div class="box">
            <h2>Fortnite</h2>
            <p>Battle royale con costruzioni</p>
        </div>
    </div>
</body>
</html>
